<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serang! 🔥</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }

    body {
        min-height:100vh;
        background:#0b0e14;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:'Segoe UI', system-ui, sans-serif;
        overflow:hidden;
    }

    .container {
        position:relative;
        width:100vw;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    /* ===== GAMBAR UTAMA ===== */
    #mainImage {
        max-width:90vw;
        max-height:85vh;
        object-fit:contain;
        border-radius:16px;
        box-shadow:0 20px 40px rgba(0,0,0,.8), 0 0 0 2px rgba(255,180,40,.3);
        contain:layout paint;
    }

    /* ===== TOMBOL SERANG ===== */
    .btn-serang {
        position:fixed;
        bottom:120px;
        right:40px;
        z-index:999;
        background:#ffffff;
        border:3px solid #000000;
        border-radius:60px;
        padding:16px 40px;
        font-size:2rem;
        font-weight:900;
        letter-spacing:4px;
        color:#000000;
        box-shadow:0 6px 0 #000000, 0 10px 20px rgba(0,0,0,.5);
        cursor:pointer;
        transition:transform .08s ease, box-shadow .1s ease;
        font-family:'Impact', 'Arial Black', sans-serif;
        transform:rotate(-2deg);
        will-change:transform;
    }
    .btn-serang:active:not(:disabled) {
        transform:rotate(-2deg) translateY(6px) scale(.97);
        box-shadow:0 2px 0 #000000, 0 4px 10px rgba(0,0,0,.5);
    }
    .btn-serang:disabled {
        opacity:.6;
        cursor:not-allowed;
        transform:rotate(-2deg) scale(.95);
        box-shadow:0 4px 0 #000000, 0 6px 14px rgba(0,0,0,.4);
    }

    /* ===== TULISAN SABER MENANG ===== */
    .win-text {
        position:fixed;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%) scale(.7);
        font-size:clamp(2.5rem, 8vw, 6rem);
        font-weight:900;
        color:#fff7b0;
        text-shadow:0 0 20px #ffaa00, 0 0 60px #ff5500, 6px 6px 0 #3a0000;
        z-index:1100;
        pointer-events:none;
        opacity:0;
        visibility:hidden;
        white-space:nowrap;
        font-family:'Impact', 'Arial Black', sans-serif;
        letter-spacing:8px;
        text-align:center;
        will-change:transform, opacity;
        transition:opacity .3s ease, transform .4s cubic-bezier(.2,1.6,.4,1), visibility .3s;
    }
    .win-text.show {
        opacity:1;
        visibility:visible;
        transform:translate(-50%, -50%) scale(1);
    }

    /* ===== FOTO KIRI & KANAN DENGAN ANIMASI PUTAR ===== */
    .side-photo {
        position:fixed;
        top:50%;
        width:min(28vw, 320px);
        height:auto;
        z-index:1090;
        pointer-events:none;
        opacity:0;
        visibility:hidden;
        will-change:transform, opacity;
        filter:drop-shadow(0 10px 30px rgba(0,0,0,.7))
               drop-shadow(0 0 20px rgba(255,180,40,.6));
        transition:opacity .35s ease, visibility .35s;
    }

    /* Foto 13.png → kiri */
    .side-photo.left {
        left:2vw;
        transform:translate(-120%, -50%) rotate(-360deg) scale(.5);
    }
    /* Foto 14.png → kanan */
    .side-photo.right {
        right:2vw;
        transform:translate(120%, -50%) rotate(360deg) scale(.5);
    }

    /* Saat muncul → putar ke posisi normal */
    .side-photo.left.show {
        opacity:1;
        visibility:visible;
        transform:translate(0, -50%) rotate(0deg) scale(1);
        transition:opacity .5s ease, transform 1s cubic-bezier(.2,1.5,.4,1), visibility .5s;
    }
    .side-photo.right.show {
        opacity:1;
        visibility:visible;
        transform:translate(0, -50%) rotate(0deg) scale(1);
        transition:opacity .5s ease, transform 1s cubic-bezier(.2,1.5,.4,1), visibility .5s;
    }

    /* Spin terus-menerus setelah muncul */
    .side-photo.left.show.spin {
        animation: spinLeft 4s linear infinite;
    }
    .side-photo.right.show.spin {
        animation: spinRight 4s linear infinite;
    }

    @keyframes spinLeft {
        from { transform:translate(0, -50%) rotate(0deg); }
        to   { transform:translate(0, -50%) rotate(-360deg); }
    }
    @keyframes spinRight {
        from { transform:translate(0, -50%) rotate(0deg); }
        to   { transform:translate(0, -50%) rotate(360deg); }
    }

    /* Responsif */
    @media (max-width:700px) {
        .btn-serang {
            font-size:1.4rem;
            padding:12px 26px;
            bottom:90px;
            right:20px;
            letter-spacing:2px;
            border-width:2px;
            box-shadow:0 4px 0 #000, 0 8px 16px rgba(0,0,0,.5);
        }
        .win-text { letter-spacing:4px; }
        .side-photo { width:32vw; }
    }
</style>
</head>
<body>
<div class="container">
    <img id="mainImage" src="1.png" alt="Saber battle">

    <button class="btn-serang" id="attackBtn">SERANG</button>

    <!-- Foto kiri & kanan -->
    <img class="side-photo left"  id="photoLeft"  src="13.png" alt="Foto 13">
    <img class="side-photo right" id="photoRight" src="14.png" alt="Foto 14">

    <!-- Tulisan SABER MENANG -->
    <div class="win-text" id="winText">SABER MENANG</div>
</div>

<script>
(function () {
    'use strict';

    const MAX_IMAGES = 10;
    const FINAL_INDEX = 10;

    let currentIndex = 1;
    let isAnimating = false;
    let isFinished = false;

    const imgElement  = document.getElementById('mainImage');
    const attackBtn   = document.getElementById('attackBtn');
    const winText     = document.getElementById('winText');
    const photoLeft   = document.getElementById('photoLeft');
    const photoRight  = document.getElementById('photoRight');

    // ===== Preload semua gambar (2-10 + 13,14) =====
    (function preload() {
        for (let i = 2; i <= MAX_IMAGES; i++) {
            const im = new Image();
            im.src = i + '.png';
        }
        new Image().src = '13.png';
        new Image().src = '14.png';
    })();

    // ===== Tampilkan tulisan SABER MENANG =====
    function showWinText() {
        winText.classList.add('show');
        setTimeout(() => winText.classList.remove('show'), 2600);
    }

    // ===== Tampilkan foto kiri & kanan dengan animasi putar =====
    function showSidePhotos() {
        // Foto muncul (slide + rotate masuk)
        photoLeft.classList.add('show');
        photoRight.classList.add('show');

        // Setelah animasi masuk selesai (~1s), mulai spin terus-menerus
        setTimeout(() => {
            photoLeft.classList.add('spin');
            photoRight.classList.add('spin');
        }, 1000);
    }

    // ===== Handler tombol =====
    function handleAttack() {
        if (isFinished || isAnimating) return;
        isAnimating = true;

        const nextIndex = currentIndex + 1;
        imgElement.src = nextIndex + '.png';
        currentIndex = nextIndex;

        // Jika sudah gambar 10 → tulisan menang + foto samping muncul
        if (currentIndex >= FINAL_INDEX) {
            isFinished = true;
            attackBtn.disabled = true;
            attackBtn.textContent = 'SELESAI';

            showWinText();
            setTimeout(showSidePhotos, 400);
        }

        setTimeout(() => { isAnimating = false; }, 500);
    }

    // ===== Init =====
    function init() {
        imgElement.src = '1.png';
        currentIndex = 1;
        isFinished = false;
        isAnimating = false;
        attackBtn.disabled = false;
        attackBtn.textContent = 'SERANG';
        winText.classList.remove('show');

        // Reset foto samping
        photoLeft.classList.remove('show', 'spin');
        photoRight.classList.remove('show', 'spin');
    }

    attackBtn.addEventListener('click', handleAttack);
    window.addEventListener('load', init);
})();
</script>
</body>
</html>
